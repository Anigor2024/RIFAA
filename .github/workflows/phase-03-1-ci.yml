name: RIFAA Quality CI

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rifaa-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate media
        run: npm run validate:media

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
